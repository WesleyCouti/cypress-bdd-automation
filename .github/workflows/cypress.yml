name: Cypress BDD Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  cypress-tests:
    name: Cypress BDD Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run Cypress regression tests
        run: npm run test:regression

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-regression-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-regression-videos
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 14

  smoke-tests:
    name: Cypress BDD Smoke Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run Cypress smoke tests
        run: npm run test:smoke

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-smoke-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-smoke-videos
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 14